spring:
  application:
    name: ms-ia-recomendacion
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/hospital_triaje}
    username: ${DB_USER:triage}
    password: ${DB_PASSWORD:triage}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: ${PORT:8084}
  http2:
    enabled: true

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite,gemini-3.1-flash-lite}
    # La clave se comparte con otras apps: por encima de esto el triaje sigue solo con el protocolo.
    daily-limit: ${GEMINI_DAILY_LIMIT:150}
    per-minute-limit: ${GEMINI_PER_MINUTE_LIMIT:6}
