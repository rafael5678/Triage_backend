name: CI - Integración Continua TriageIA

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Compilación y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17 LTS (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilación del Reactor Maven
        run: mvn -B -q clean compile -DskipTests

      - name: Ejecución de la Suite Completa de Pruebas
        run: mvn -B test

