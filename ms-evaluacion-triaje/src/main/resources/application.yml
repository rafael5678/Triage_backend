spring:
  application:
    name: ms-evaluacion-triaje
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/hospital_triaje}
    username: ${DB_USER:triage}
    password: ${DB_PASSWORD:triage}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: ${PORT:8082}

grpc:
  server:
    port: ${GRPC_PORT:9082}
  client:
    GLOBAL:
      negotiation-type: plaintext
    pacientes:
      address: ${GRPC_CLIENT_PACIENTES:static://localhost:9081}
    ia:
      address: ${GRPC_CLIENT_IA:static://localhost:9084}

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
