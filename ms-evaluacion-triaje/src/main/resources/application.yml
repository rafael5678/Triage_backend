spring:
  application:
    name: ms-evaluacion-triaje
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/hospital_triaje}
    username: ${DB_USER:triage}
    password: ${DB_PASSWORD:triage}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: ${PORT:8082}
  http2:
    enabled: true

grpc:
  client:
    GLOBAL:
      negotiation-type: ${GRPC_NEGOTIATION:plaintext}
    pacientes:
      address: ${GRPC_CLIENT_PACIENTES:static://localhost:8081}
    ia:
      address: ${GRPC_CLIENT_IA:static://localhost:8084}

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
