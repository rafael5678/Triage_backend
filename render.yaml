# Render — Web Service nuevo (no mezclar con otros proyectos)
# Postgres debe llamarse Hospital_triage

services:
  - type: web
    name: hospital-triaje-api
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/triage/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: Hospital_triage
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: Hospital_triage
    plan: free
