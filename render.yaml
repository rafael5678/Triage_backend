# Un repo, cuatro Web Services. La base es la de Supabase, la misma para todos.
# No hace falta una rama por módulo. DATABASE_URL se pega a mano en Render.

services:
  - type: web
    name: ms-pacientes-auth
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: MODULE
        value: ms-pacientes-auth
      - key: GRPC_PORT
        value: "9081"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: ms-evaluacion-triaje
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/triage/health
    envVars:
      - key: MODULE
        value: ms-evaluacion-triaje
      - key: GRPC_PORT
        value: "9082"
      - key: GRPC_CLIENT_PACIENTES
        sync: false
      - key: GRPC_CLIENT_IA
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ms-cola-espera
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/triage/health
    envVars:
      - key: MODULE
        value: ms-cola-espera
      - key: GRPC_CLIENT_EVALUACION
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ms-ia-recomendacion
    runtime: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/ia/health
    envVars:
      - key: MODULE
        value: ms-ia-recomendacion
      - key: GRPC_PORT
        value: "9084"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
