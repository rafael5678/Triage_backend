server:
  port: ${PORT:8083}

grpc:
  client:
    GLOBAL:
      negotiation-type: ${GRPC_NEGOTIATION:plaintext}
    evaluacion:
      address: ${GRPC_CLIENT_EVALUACION:static://localhost:8082}

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  whatsapp:
    # WhatsApp Cloud API de Meta. Sin token ni phone-number-id no se envía nada y el personal usa el botón de la app.
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_ID:}
    template: ${WHATSAPP_TEMPLATE:}
    template-language: ${WHATSAPP_TEMPLATE_LANG:es}
    lead-minutes: ${WHATSAPP_LEAD_MINUTES:10}
    position-lead: ${WHATSAPP_POSITION_LEAD:2}
